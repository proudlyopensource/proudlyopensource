services:
  postgres:
    image: postgres:17-alpine
    container_name: proudlyopensource-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: proudlyopensource
      POSTGRES_USER: proudlyopensource
      POSTGRES_PASSWORD: proudlyopensource
    ports:
      - "5432:5432"
    volumes:
      - proudlyopensource-postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U proudlyopensource -d proudlyopensource"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  proudlyopensource-postgres:
